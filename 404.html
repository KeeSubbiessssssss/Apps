<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found</title>
    <script>
      (function () {
        var path = window.location.pathname;

        if (path === "/AWC" || path.indexOf("/AWC/") === 0) {
          window.location.replace(
            path.replace("/AWC", "/awc") + window.location.search + window.location.hash
          );
        }
      })();
    </script>
  </head>
  <body>
    <h1>Page not found</h1>
  </body>
</html>
